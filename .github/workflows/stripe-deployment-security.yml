name: Stripe Deployment Security

on:
  pull_request:
    paths:
      - 'backend/scripts/**'
      - 'backend/migrations/**'
      - 'backend/docs/stripe_provisioning_migration_manifest.sha256'
      - '.github/workflows/stripe-deployment-security.yml'
  push:
    branches:
      - main
      - feat/driver-operations
    paths:
      - 'backend/scripts/**'
      - 'backend/migrations/**'
      - 'backend/docs/stripe_provisioning_migration_manifest.sha256'
      - '.github/workflows/stripe-deployment-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-deployment-security:
    name: Stripe deployment security regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        shell: bash
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify regression syntax
        run: |
          set -euo pipefail

          for test in scripts/tests/stripe_provisioning_*_test.sh; do
            bash -n "$test"
          done

      - name: Run deployment security regressions
        run: |
          set -euo pipefail

          tests=(
            stripe_provisioning_deployment_approval_gate_test.sh
            stripe_provisioning_deployment_verification_test.sh
            stripe_provisioning_executable_contract_test.sh
            stripe_provisioning_executable_shadowing_test.sh
            stripe_provisioning_git_sha256_shadowing_test.sh
            stripe_provisioning_git_environment_isolation_test.sh
            stripe_provisioning_psql_environment_isolation_test.sh
            stripe_provisioning_psql_shadowing_test.sh
            stripe_provisioning_migration_integrity_test.sh
            stripe_provisioning_sha256_environment_isolation_test.sh
          )

          for test in "${tests[@]}"; do
            echo "===== RUNNING: $test ====="
            bash "scripts/tests/$test"
          done

          echo "TEN STRIPE DEPLOYMENT SECURITY REGRESSIONS PASSED"

  stripe-database-identity:
    name: PostgreSQL database identity regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: backend

    env:
      PGHOST: 127.0.0.1
      PGPORT: '55432'
      PGUSER: postgres
      PGDATABASE: connect_settlement_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify PostgreSQL client and Docker
        run: |
          set -euo pipefail
          command -v psql
          command -v docker
          bash -n scripts/tests/stripe_provisioning_database_identity_gate_test.sh
          bash -n scripts/stripe_provisioning_database_identity_gate.sh

      - name: Start isolated PostgreSQL fixture
        run: |
          set -euo pipefail

          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"

          docker run -d \
            --name connect-financial-test-postgres \
            --restart no \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_DB=connect_settlement_test \
            --env POSTGRES_PASSWORD="$password" \
            postgres:16 >/dev/null

          echo "PGPASSWORD=$password" >> "$GITHUB_ENV"

      - name: Wait for isolated PostgreSQL
        run: |
          set -euo pipefail

          ready=false

          for attempt in $(seq 1 60); do
            if PGPASSWORD="$PGPASSWORD" \
              psql -X -w -v ON_ERROR_STOP=1 \
                -h 127.0.0.1 -p 55432 \
                -U postgres -d connect_settlement_test \
                -Atc 'SELECT 1' >/dev/null 2>&1; then
              ready=true
              break
            fi

            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "STOP: isolated PostgreSQL did not become ready"
            exit 1
          fi

          echo "PASS: isolated PostgreSQL ready"

      - name: Run database identity regression
        run: |
          set -euo pipefail

          test "$(docker inspect -f '{{.State.Running}}' connect-financial-test-postgres)" = true
          test "$(docker port connect-financial-test-postgres 5432/tcp)" = 127.0.0.1:55432

          bash scripts/tests/stripe_provisioning_database_identity_gate_test.sh

      - name: Remove isolated PostgreSQL fixture
        if: always()
        run: |
          docker rm -f connect-financial-test-postgres >/dev/null 2>&1 || true
